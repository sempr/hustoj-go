# 语言注册表（Web 与判题共用的唯一真相来源）。
#
# 每个 [[lang]] 条目：
#   id           语言索引。必须从 0 连续；solution.language / $OJ_LANGMASK /
#                OJ_LANG_SET 都以它为准。
#   name         判题侧注册名（历史上用于日志，判题逻辑本身不依赖）。
#   display_name Web 展示名。必须与 PHP 的 $language_name（const.inc.php）逐项
#                对齐；extra/check_lang_index.sh 会校验。
#   suffix       题目目录 prepend/append 模板与判题源文件名所用的后缀（含点）。
#   brush        可选。showsource 语法高亮 brush；缺省取 display_name 小写。
#                仅当小写名不是合法的 SyntaxHighlighter brush 时才需要显式声明。
#   source_header 可选。提交源码前强制追加的头（如 Python 的 "# coding=utf-8"）；
#                非空时在拼接 prepend/append 模板之前加进源码。
#
# 某语言是否存在 <id>.lang.toml 决定它是否"已安装"，从而决定状态页/提交页
# 是否列出（见 pkg/language 的 Installed）。

[[lang]]
name = "C"
display_name = "C"
id = 0
suffix = ".c"

