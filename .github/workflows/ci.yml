name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']  # 触发发布构建
  pull_request:
    branches: [main, develop]

env:
  # 统一数据库连接（CI 服务容器）
  DB_DSN: "hustoj:hustoj@tcp(127.0.0.1:3306)/hustoj?parseTime=true"
  # Go 版本统一管理
  GO_VERSION: '1.24'

jobs:
  migrate-check:
    name: 数据库迁移与结构校验
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hustoj
          MYSQL_USER: hustoj
          MYSQL_PASSWORD: hustoj
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史以便 git describe 生成版本号

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 安装工具链
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          curl -sSf https://atlasgo.sh | sh -s -- -y
          echo "$HOME/go/bin:$HOME/.atlas/bin" >> $GITHUB_PATH

      - name: 等待 MySQL 就绪
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root -proot && break
            sleep 2
          done

      - name: 初始化数据库（schema.sql + triggers + seed）
        run: |
          mysql -h 127.0.0.1 -u root -proot hustoj < schema/schema.sql
          mysql -h 127.0.0.1 -u root -proot hustoj < schema/triggers.sql
          mysql -h 127.0.0.1 -u root -proot hustoj < schema/seed.sql

      - name: 登记迁移基线（模拟生产库已是新结构）
        run: |
          goose -dir migrations mysql "$DB_DSN" -baseline up

      - name: 运行迁移检查（核心门禁）
        run: make migrate-check

      - name: 验证 sqlc 代码可编译
        run: go build ./internal/db/sqlc/...

  build-test:
    name: 编译与单测
    runs-on: ubuntu-latest
    needs: migrate-check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod tidy
      - run: go build -tags embed_tini -trimpath .
      - run: go test ./...

  # 可选：生成迁移脚本的预览（PR 时自动生成供审阅）
  migrate-preview:
    name: 迁移脚本预览
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      mysql:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hustoj_dev
          MYSQL_USER: hustoj
          MYSQL_PASSWORD: hustoj
        ports: ["3307:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: 安装 atlas
        run: curl -sSf https://atlasgo.sh | sh -s -- -y
      - name: 初始化开发库（基于当前 main 分支结构）
        run: |
          # 这里简化：直接用 schema.sql 建库
          mysql -h 127.0.0.1 -P 3307 -u root -proot -e "CREATE DATABASE hustoj_dev"
          mysql -h 127.0.0.1 -P 3307 -u root -proot hustoj_dev < schema/schema.sql
      - name: 生成差异迁移（对比 schema.sql 变更）
        id: gen
        run: |
          atlas migrate diff auto \
            --dir file://migrations \
            --to file://schema/schema.sql \
            --dev-url "mysql://hustoj:hustoj@tcp(127.0.0.1:3307)/hustoj_dev?parseTime=true" \
            --format '{{ sql }}'
        env:
          ATLAS_NO_UPDATE_CHECK: "1"
      - name: 上传生成的迁移作为 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-migration
          path: migrations/*_auto.sql
          retention-days: 7

  # ==================== 发布构建 ====================
  release:
    name: 发布构建 (${{ matrix.goarch }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [migrate-check, build-test]
    strategy:
      matrix:
        goarch: [amd64, arm64]
    permissions:
      contents: write  # 创建 Release 需要
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 设置 QEMU（arm64 交叉编译需要）
        if: matrix.goarch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: 准备打包依赖
        run: |
          sudo apt-get update && sudo apt-get install -y \
            make \
            gcc \
            libc6-dev \
            gcc-aarch64-linux-gnu \
            upx-ucl

      - name: 打包（复用 extra/package.sh）
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd extra
          # 版本号从 tag 推导（去掉 v 前缀）
          VERSION="${GITHUB_REF_NAME#v}"
          bash package.sh linux/${{ matrix.goarch }} --version "$VERSION"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goarch }}
          path: |
            extra/dist/hustoj-go-${{ github.ref_name }}*-linux-${{ matrix.goarch }}.tar.gz
            extra/dist/hustoj-go-${{ github.ref_name }}*-linux-${{ matrix.goarch }}.tar.gz.sha256
          retention-days: 30

  # 创建 GitHub Release (主程序)
  create-release:
    name: 创建 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - name: 下载所有架构产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: 整理产物结构
        run: |
          ls -la dist/
          # package.sh 生成的文件名包含版本号，如 hustoj-go-v0.2.1-linux-amd64.tar.gz
          # 重命名为简洁名便于用户下载
          for f in dist/hustoj-go-*-linux-amd64.tar.gz; do
            [ -f "$f" ] && mv "$f" "dist/hustoj-go-linux-amd64.tar.gz"
          done
          for f in dist/hustoj-go-*-linux-amd64.tar.gz.sha256; do
            [ -f "$f" ] && mv "$f" "dist/hustoj-go-linux-amd64.tar.gz.sha256"
          done
          for f in dist/hustoj-go-*-linux-arm64.tar.gz; do
            [ -f "$f" ] && mv "$f" "dist/hustoj-go-linux-arm64.tar.gz"
          done
          for f in dist/hustoj-go-*-linux-arm64.tar.gz.sha256; do
            [ -f "$f" ] && mv "$f" "dist/hustoj-go-linux-arm64.tar.gz.sha256"
          done
          ls -la dist/

      - name: 生成发布说明
        id: changelog
        run: |
          # 从上一个 tag 生成变更日志
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s (%h)' $PREV_TAG..HEAD > changelog.md
          else
            git log --pretty=format:'- %s (%h)' -20 > changelog.md
          fi
          cat changelog.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: changelog.md
          files: |
            dist/hustoj-go-linux-amd64.tar.gz
            dist/hustoj-go-linux-amd64.tar.gz.sha256
            dist/hustoj-go-linux-arm64.tar.gz
            dist/hustoj-go-linux-arm64.tar.gz.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}

  # ==================== 预构建 Rootfs 发布 ====================
  rootfs-build:
    name: 构建 Rootfs (${{ matrix.lang }}/${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        include:
          - lang: c
            id: 0
            arch: amd64
          - lang: c
            id: 0
            arch: arm64
          - lang: cpp
            id: 1
            arch: amd64
          - lang: cpp
            id: 1
            arch: arm64
          - lang: java
            id: 3
            arch: amd64
          - lang: java
            id: 3
            arch: arm64
          - lang: python
            id: 6
            arch: amd64
          - lang: python
            id: 6
            arch: arm64
          - lang: node
            id: 16
            arch: amd64
          - lang: node
            id: 16
            arch: arm64
          - lang: go
            id: 17
            arch: amd64
          - lang: go
            id: 17
            arch: arm64
          - lang: rust
            id: 25
            arch: amd64
          - lang: rust
            id: 25
            arch: arm64
          - lang: php
            id: 7
            arch: amd64
          - lang: php
            id: 7
            arch: arm64
          - lang: csharp
            id: 9
            arch: amd64
          - lang: csharp
            id: 9
            arch: arm64
          - lang: pascal
            id: 2
            arch: amd64
          - lang: pascal
            id: 2
            arch: arm64
          - lang: bash
            id: 5
            arch: amd64
          - lang: bash
            id: 5
            arch: arm64
          - lang: perl
            id: 8
            arch: amd64
          - lang: perl
            id: 8
            arch: arm64
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 QEMU (arm64)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建预构建 Rootfs
        run: |
          cd extra
          chmod +x build_prebuilt_rootfs.sh
          VERSION="${GITHUB_REF_NAME#v}"
          ./build_prebuilt_rootfs.sh --lang ${{ matrix.id }} --arch ${{ matrix.arch }} --load --out-dir "$ROOT/dist/prebuilt-rootfs"

      - name: 上传 Rootfs 产物
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.lang }}-${{ matrix.arch }}
          path: |
            extra/dist/prebuilt-rootfs/rootfs-${{ matrix.lang }}-${{ matrix.arch }}.tar.gz
            extra/dist/prebuilt-rootfs/rootfs-${{ matrix.lang }}-${{ matrix.arch }}.tar.gz.sha256
          retention-days: 30

  rootfs-release:
    name: 发布 Rootfs 集合
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: rootfs-build
    permissions:
      contents: write
    steps:
      - name: 下载所有架构/语言产物
        uses: actions/download-artifact@v4
        with:
          path: rootfs-dist
          pattern: rootfs-*
          merge-multiple: true

      - name: 生成 manifest.json
        run: |
          cd rootfs-dist
          # GitHub Actions 表达式不支持 # 前缀删除，在 shell 中处理
          VERSION="${GITHUB_REF_NAME#v}"
          cat > manifest.json <<EOF
          {
            "version": "$VERSION",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "architectures": ["amd64", "arm64"],
            "languages": {}
          }
          EOF
          
          for f in rootfs-*-amd64.tar.gz; do
            [ -f "$f" ] || continue
            lang=$(echo "$f" | sed 's/rootfs-\(.*\)-amd64.tar.gz/\1/')
            sha256=$(cat "rootfs-${lang}-amd64.tar.gz.sha256" 2>/dev/null | awk '{print $1}')
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ -n "$sha256" ]; then
              jq --arg lang "$lang" --arg sha "$sha256" --arg size "$size" \
                '.languages[$lang].amd64 = {sha256: $sha, size: ($size|tonumber)}' \
                manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json
            fi
          done
          
          for f in rootfs-*-arm64.tar.gz; do
            [ -f "$f" ] || continue
            lang=$(echo "$f" | sed 's/rootfs-\(.*\)-arm64.tar.gz/\1/')
            sha256=$(cat "rootfs-${lang}-arm64.tar.gz.sha256" 2>/dev/null | awk '{print $1}')
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ -n "$sha256" ]; then
              jq --arg lang "$lang" --arg sha "$sha256" --arg size "$size" \
                '.languages[$lang].arm64 = {sha256: $sha, size: ($size|tonumber)}' \
                manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json
            fi
          done
          
          cat manifest.json

      - name: 创建 Rootfs Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rootfs-${{ github.ref_name }}
          name: Prebuilt Rootfs ${{ github.ref_name }}
          body: |
            预构建语言运行环境 Rootfs，解压即用，无需 Docker。

            ## 使用方法
            ```bash
            # 下载对应语言和架构
            wget https://github.com/${{ github.repository }}/releases/download/rootfs-${{ github.ref_name }}/rootfs-go-amd64.tar.gz
            wget https://github.com/${{ github.repository }}/releases/download/rootfs-${{ github.ref_name }}/rootfs-go-amd64.tar.gz.sha256

            # 校验
            sha256sum -c rootfs-go-amd64.tar.gz.sha256

            # 解压到判题沙箱目录
            mkdir -p /opt/hustoj/langs/go
            tar -xzf rootfs-go-amd64.tar.gz -C /opt/hustoj/langs/go
            ```

            ## 支持的语言
            | 语言 | ID | amd64 | arm64 |
            |------|-----|-------|-------|
            | C | 0 | ✅ | ✅ |
            | C++ (C++14 默认) | 1 | ✅ | ✅ |
            | C++11 | 26 | ✅ | ✅ |
            | C++17 | 27 | ✅ | ✅ |
            | C++20 | 28 | ✅ | ✅ |
            | C++23 | 29 | ✅ | ✅ |
            | Java | 3 | ✅ | ✅ |
            | Python | 6 | ✅ | ✅ |
            | Node.js | 16 | ✅ | ✅ |
            | Go | 17 | ✅ | ✅ |
            | Rust | 25 | ✅ | ✅ |
            | PHP | 7 | ✅ | ✅ |
            | C# | 9 | ✅ | ✅ |
            | Pascal | 2 | ✅ | ✅ |
            | Bash | 5 | ✅ | ✅ |
            | Perl | 8 | ✅ | ✅ |

            ## 自动安装（推荐）
            离线部署包自带 `install_langs.sh`，会自动检测并使用预构建 rootfs：
            ```bash
            sudo ./install_langs.sh --ojhome /home/judge --use-prebuilt
            ```
          files: |
            rootfs-dist/rootfs-*.tar.gz
            rootfs-dist/rootfs-*.tar.gz.sha256
            rootfs-dist/manifest.json
          draft: false
          prerelease: false