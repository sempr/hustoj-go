name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']  # 触发发布构建
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.24'

jobs:
  build-test:
    name: 编译与单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod tidy
      - run: make -C tini static
      - run: go build -tags embed_tini -trimpath .
      - run: go test ./...

  # ==================== 发布构建 ====================
  release:
    name: 发布构建
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: write  # 创建 Release 需要
    strategy:
      matrix:
        goarch: [amd64]
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 准备打包依赖
        run: |
          sudo apt-get update && sudo apt-get install -y \
            make \
            gcc \
            libc6-dev \
            upx-ucl

      - name: 打包（复用 extra/package.sh）
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd extra
          # 版本号从 tag 推导（去掉 v 前缀）
          VERSION="${GITHUB_REF_NAME#v}"
          bash package.sh linux/${{ matrix.goarch }} --version "$VERSION"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goarch }}
          path: |
            extra/dist/*
          retention-days: 30

  # 创建 GitHub Release (主程序)
  create-release:
    name: 创建 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载所有架构产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: 整理产物结构
        run: |
          mkdir -p dist
          echo "=== downloaded tree ==="
          find dist -type f -printf '%p\\n' | sort
          echo "=== flatten ==="
          # download-artifact v4 may place files under per-artifact subdirs; flatten
          find dist -mindepth 2 -type f -exec cp -f {} dist/ \\;
          # rename to a clean user-friendly name
          for f in dist/hustoj-go-*.tar.gz; do
            [ -f "$f" ] || continue
            case "$f" in dist/hustoj-go-linux-amd64.tar.gz) : ;; *) mv "$f" "dist/hustoj-go-linux-amd64.tar.gz" ;; esac
          done
          for f in dist/hustoj-go-*.tar.gz.sha256; do
            [ -f "$f" ] || continue
            case "$f" in dist/hustoj-go-linux-amd64.tar.gz.sha256) : ;; *) mv "$f" "dist/hustoj-go-linux-amd64.tar.gz.sha256" ;; esac
          done
          echo "=== final ==="
          find dist -type f -printf '%p\\n' | sort
      - name: 生成发布说明
        id: changelog
        run: |
          # 从上一个 tag 生成变更日志
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s (%h)' $PREV_TAG..HEAD > changelog.md
          else
            git log --pretty=format:'- %s (%h)' -20 > changelog.md
          fi
          cat changelog.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: changelog.md
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}

  # ==================== 预构建 Rootfs 发布 ====================
  rootfs-build:
    name: 构建 Rootfs (${{ matrix.lang }}/${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        include:
          # C/C++ 共用同一个 rootfs (debian:13-slim + gcc/g++)
          - lang: cpp
            id: 1
            arch: amd64
          - lang: python
            id: 6
            arch: amd64
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建预构建 Rootfs
        run: |
          cd extra
          chmod +x build_prebuilt_rootfs.sh
          VERSION="${GITHUB_REF_NAME#v}"
          # 使用 github.workspace 作为绝对路径，避免权限问题
          ./build_prebuilt_rootfs.sh --lang ${{ matrix.id }} --arch ${{ matrix.arch }} --load --out-dir "${{ github.workspace }}/dist/prebuilt-rootfs"

      - name: 上传 Rootfs 产物
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.lang }}-${{ matrix.arch }}
          path: |
            ${{ github.workspace }}/dist/prebuilt-rootfs/rootfs-${{ matrix.lang }}-${{ matrix.arch }}.tar.gz
            ${{ github.workspace }}/dist/prebuilt-rootfs/rootfs-${{ matrix.lang }}-${{ matrix.arch }}.tar.gz.sha256
          retention-days: 30

  rootfs-release:
    name: 发布 Rootfs 集合
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: rootfs-build
    permissions:
      contents: write
    steps:
      - name: 下载所有架构/语言产物
        uses: actions/download-artifact@v4
        with:
          path: rootfs-dist
          pattern: rootfs-*
          merge-multiple: true

      - name: 生成 manifest.json
        run: |
          cd rootfs-dist
          # GitHub Actions 表达式不支持 # 前缀删除，在 shell 中处理
          VERSION="${GITHUB_REF_NAME#v}"
          cat > manifest.json <<EOF
          {
            "version": "$VERSION",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "architectures": ["amd64"],
            "languages": {}
          }
          EOF
          
          for f in rootfs-*-amd64.tar.gz; do
            [ -f "$f" ] || continue
            lang=$(echo "$f" | sed 's/rootfs-\(.*\)-amd64.tar.gz/\1/')
            sha256=$(cat "rootfs-${lang}-amd64.tar.gz.sha256" 2>/dev/null | awk '{print $1}')
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ -n "$sha256" ]; then
              jq --arg lang "$lang" --arg sha "$sha256" --arg size "$size" \
                '.languages[$lang].amd64 = {sha256: $sha, size: ($size|tonumber)}' \
                manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json
            fi
          done
          
          cat manifest.json

      - name: 创建 Rootfs Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rootfs-${{ github.ref_name }}
          name: Prebuilt Rootfs ${{ github.ref_name }}
          body: |
            预构建语言运行环境 Rootfs，解压即用，无需 Docker。

            ## 使用方法
            ```bash
            # 下载对应语言和架构
            wget https://github.com/${{ github.repository }}/releases/download/rootfs-${{ github.ref_name }}/rootfs-go-amd64.tar.gz
            wget https://github.com/${{ github.repository }}/releases/download/rootfs-${{ github.ref_name }}/rootfs-go-amd64.tar.gz.sha256

            # 校验
            sha256sum -c rootfs-go-amd64.tar.gz.sha256

            # 解压到判题沙箱目录
            mkdir -p /opt/hustoj/langs/go
            tar -xzf rootfs-go-amd64.tar.gz -C /opt/hustoj/langs/go
            ```

            ## 支持的语言（当前首批发布）
            | 语言 | ID | amd64 | 备注 |
            |------|-----|-------|------|
            | C/C++ (共用) | 0/1 | ✅ | 共用 debian:13-slim + gcc/g++ |
            | Python | 6 | ✅ | |
            | C++11 | 26 | ✅ | 仅 PCH 不同（随 C++ 共用 rootfs 发布） |
            | C++17 | 27 | ✅ | 仅 PCH 不同 |
            | C++20 | 28 | ✅ | 仅 PCH 不同 |
            | C++23 | 29 | ✅ | 仅 PCH 不同 |
            | *更多语言敬请期待* | | | 后续版本陆续添加 |

            ## 自动安装（推荐）
            离线部署包自带 `install_langs.sh`，会自动检测并使用预构建 rootfs：
            ```bash
            sudo ./install_langs.sh --ojhome /home/judge --use-prebuilt
            ```
          files: |
            rootfs-dist/rootfs-*.tar.gz
            rootfs-dist/rootfs-*.tar.gz.sha256
            rootfs-dist/manifest.json
          draft: false
          prerelease: false
